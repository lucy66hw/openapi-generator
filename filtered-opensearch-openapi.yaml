    BoolQuery:
      allOf:
      - $ref: '#/components/schemas/QueryBase'
      - properties:
          adjust_pure_negative:
            default: true
            description: 'Ensures correct behavior when a query contains only `must_not`
              clauses.

              By default set to true, OpenSearch adds a match-all clause to ensure
              results are returned from Lucene, with the `must_not` conditions applied
              as filters.

              If set to false, the query may return no results, as Lucene typically
              requires at least one positive condition.'
            type: boolean
          filter:
            description: 'The clause (query) must appear in matching documents.

              However, unlike `must`, the score of the query will be ignored.'
            oneOf:
            - $ref: '#/components/schemas/QueryContainer'
            - items:
                $ref: '#/components/schemas/QueryContainer'
              type: array
          minimum_should_match:
            $ref: '#/components/schemas/MinimumShouldMatch'
          must:
            description: The clause (query) must appear in matching documents and
              will contribute to the score.
            oneOf:
            - $ref: '#/components/schemas/QueryContainer'
            - items:
                $ref: '#/components/schemas/QueryContainer'
              type: array
          must_not:
            description: 'The clause (query) must not appear in the matching documents.

              Because scoring is ignored, a score of `0` is returned for all documents.'
            oneOf:
            - $ref: '#/components/schemas/QueryContainer'
            - items:
                $ref: '#/components/schemas/QueryContainer'
              type: array
          should:
            description: The clause (query) should appear in the matching document.
            oneOf:
            - $ref: '#/components/schemas/QueryContainer'
            - items:
                $ref: '#/components/schemas/QueryContainer'
              type: array
        type: object
