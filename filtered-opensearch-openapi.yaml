      type: string
    TrackHits:
      description: 'The number of hits matching the query. When `true`, the exact

        number of hits is returned at the cost of some performance. When `false`,
        the

        response does not include the total number of hits matching the query.

        Default is `10,000` hits.'
      oneOf:
      - type: boolean
      - format: int32
        type: integer
    Type:
      type: string
      x-version-removed: '2.0'
    TypeQuery:
      allOf:
      - $ref: '#/components/schemas/QueryBase'
      - properties:
          value:
            type: string
        required:
        - value
        type: object
    UnitMillis:
      description: The time unit for milliseconds.
      format: int64
      type: integer
    UnitNanos:
      description: Time unit for nanoseconds.
      format: int64
      type: integer
    UnmappedRareTermsAggregate:
      allOf:
      - $ref: '#/components/schemas/MultiBucketAggregateBaseVoid'
      - type: object
    UnmappedSamplerAggregate:
      allOf:
      - $ref: '#/components/schemas/SingleBucketAggregateBase'
      - type: object
    UnmappedSignificantTermsAggregate:
      allOf:
      - $ref: '#/components/schemas/SignificantTermsAggregateBaseVoid'
      - type: object
    UnmappedTermsAggregate:
      allOf:
      - $ref: '#/components/schemas/TermsAggregateBaseVoid'
      - type: object
    ValueCountAggregate:
      allOf:
      - $ref: '#/components/schemas/SingleMetricAggregateBase'
      - type: object
    ValueCountAggregation:
      allOf:
      - $ref: '#/components/schemas/FormattableMetricAggregation'
      - type: object
    ValueType:
      enum:
      - boolean
      - date
      - date_nanos
      - double
      - geo_point
      - ip
      - long
      - number
      - numeric
      - string
      type: string
    VariableWidthHistogramAggregate:
      allOf:
      - $ref: '#/components/schemas/MultiBucketAggregateBaseVariableWidthHistogramBucket'
      - type: object
    VariableWidthHistogramAggregation:
      properties:
        buckets:
          description: The target number of buckets.
          format: int32
          type: integer
        field:
          $ref: '#/components/schemas/Field'
        initial_buffer:
          description: 'Specifies the number of individual documents that will be
            stored in memory on a shard before the initial bucketing algorithm is
            run.

            Defaults to `min(10 * shard_size, 50000)`.'
          format: int32
          type: integer
        shard_size:
          description: 'The number of buckets that the coordinating node will request
            from each shard.

            Defaults to `buckets * 50`.'
          format: int32
          type: integer
      type: object
    VariableWidthHistogramBucket:
      allOf:
      - $ref: '#/components/schemas/MultiBucketBase'
      - properties:
          key:
            type: number
          key_as_string:
            type: string
          max:
            type: number
          max_as_string:
            type: string
          min:
            type: number
          min_as_string:
            type: string
        required:
        - key
        - max
        - min
        type: object
    VersionNumber:
      format: int64
      type: integer
    VersionString:
      type: string
    VersionType:
      enum:
      - external
      - external_gte
      - force
      - internal
      type: string
    Void:
      description: 'The absence of any type. This is commonly used in APIs that don''t
        return a body.


        Although "void" is generally used for a unit type that has only one value,
        this is interpreted as

        the bottom type, which has no value. Most languages have a unit type, but
        few have a bottom type.


        See https://en.m.wikipedia.org/wiki/Unit_type and https://en.m.wikipedia.org/wiki/Bottom_type.'
      type: object
    WeightedAverageAggregation:
      allOf:
      - $ref: '#/components/schemas/Aggregation'
      - properties:
          format:
            description: A numeric response formatter.
            type: string
          value:
            $ref: '#/components/schemas/WeightedAverageValue'
          value_type:
            $ref: '#/components/schemas/ValueType'
          weight:
            $ref: '#/components/schemas/WeightedAverageValue'
        type: object
    WeightedAverageValue:
      properties:
        field:
          $ref: '#/components/schemas/Field'
        missing:
          description: A value or weight to use if the field is missing.
          format: double
          type: number
        script:
          $ref: '#/components/schemas/Script'
      type: object
    WeightedAvgAggregate:
      allOf:
      - $ref: '#/components/schemas/SingleMetricAggregateBase'
      - type: object
    WhitespaceAnalyzer:
      properties:
        type:
          enum:
          - whitespace
          type: string
        version:
          $ref: '#/components/schemas/VersionString'
      required:
      - type
      type: object
    WildcardQuery:
      oneOf:
      - title: value
        type: string
      - allOf:
        - $ref: '#/components/schemas/QueryBase'
        - properties:
            case_insensitive:
              description: Allows case insensitive matching of the pattern with the
                indexed field values when set to `true`. Default is `false` which
                means the case sensitivity of matching depends on the underlying field's
                mapping.
              type: boolean
            rewrite:
              $ref: '#/components/schemas/MultiTermQueryRewrite'
            value:
              description: Wildcard pattern for terms you wish to find in the provided
                field. Required, when wildcard is not set.
              type: string
            wildcard:
              description: Wildcard pattern for terms you wish to find in the provided
                field. Required, when value is not set.
              type: string
          type: object
    WktGeoBounds:
      properties:
        wkt:
          type: string
      required:
      - wkt
      type: object
    WrapperQuery:
      allOf:
      - $ref: '#/components/schemas/QueryBase'
      - properties:
          query:
            description: 'A base64 encoded query.

              The binary data format can be any of JSON, YAML, CBOR or SMILE encodings'
            type: string
        required:
        - query
        type: object
    XyShape:
      properties:
        coordinates:
          type: array
        type:
          type: string
      type: object
    XyShapeField:
      properties:
        relation:
          $ref: '#/components/schemas/GeoShapeRelation'
        shape:
          $ref: '#/components/schemas/XyShape'
      required:
      - shape
      type: object
    XyShapeQuery:
      allOf:
      - $ref: '#/components/schemas/QueryBase'
      - additionalProperties:
          $ref: '#/components/schemas/XyShapeField'
        maxProperties: 1
        minProperties: 1
        type: object
      x-version-added: '2.4'
    ZeroTermsQuery:
      enum:
      - all
      - none
      type: string
    uint:
      type: integer
