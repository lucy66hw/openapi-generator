          type: boolean
        highlight_query:
          $ref: '#/components/schemas/QueryContainer'
        max_analyzer_offset:
          description: 'If set to a non-negative value, highlighting stops at this
            defined maximum limit.

            The rest of the text is not processed or highlighted, and no error is
            returned.

            The `max_analyzer_offset` query setting does not override the `index.highlight.max_analyzed_offset`
            setting, which takes precedence when it is set to a lower value than the
            query setting.'
          format: int32
          type: integer
        max_fragment_length:
          format: int32
          type: integer
        no_match_size:
          description: The amount of text you want to return from the beginning of
            the field if there are no matching fragments to highlight.
          format: int32
          type: integer
        number_of_fragments:
          description: 'The maximum number of fragments to return.

            When the number of fragments is set to `0`, no fragments are returned.

            Instead, the entirety of a field''s contents are highlighted and returned.

            This is useful when you need to highlight short texts, such as a title
            or address, in which fragmentation is not required.

