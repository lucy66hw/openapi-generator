components:
  parameters:
    query._source:
      description: 'Indicates which source fields are returned for matching documents.

        These fields are returned in the `hits._source` property of the search response.

        Valid values are:

        `true` to return the entire document source;

        `false` to not return the document source;

        `<string>` to return the source fields that are specified as a comma-separated
        list (supports wildcard (`*`) patterns).'
      in: query
      name: _source
      schema:
        $ref: '#/components/schemas/SourceConfigParam'
      style: form
    query._source_excludes:
      description: 'A comma-separated list of source fields to exclude from the response.

        You can also use this parameter to exclude fields from the subset specified
        in `_source_includes` query parameter.

        If the `_source` parameter is `false`, this parameter is ignored.'
      in: query
      name: _source_excludes
      schema:
        $ref: '#/components/schemas/Fields'
      style: form
    query._source_includes:
      description: 'A comma-separated list of source fields to include in the response.

        If this parameter is specified, only these source fields are returned.

        You can exclude fields from this subset using the `_source_excludes` query
        parameter.

        If the `_source` parameter is `false`, this parameter is ignored.'
      in: query
      name: _source_includes
      schema:
        $ref: '#/components/schemas/Fields'
      style: form
    query.allow_no_indices:
      description: 'If `false`, the request returns an error if any wildcard expression,
        index alias, or `_all` value targets only missing or closed indexes.

        This behavior applies even if the request targets other open indexes.

        For example, a request targeting `foo*,bar*` returns an error if an index
        starts with `foo` but no index starts with `bar`.'
      in: query
      name: allow_no_indices
      schema:
        type: boolean
      style: form
    query.allow_partial_search_results:
      description: If `true`, returns partial results if there are shard request timeouts
        or shard failures. If `false`, returns an error with no partial results.
      in: query
      name: allow_partial_search_results
      schema:
        default: true
        type: boolean
      style: form
    query.analyze_wildcard:
      description: 'If `true`, wildcard and prefix queries are analyzed.

        This parameter can only be used when the q query string parameter is specified.'
      in: query
      name: analyze_wildcard
      schema:
        default: false
        type: boolean
      style: form
    query.analyzer:
      description: 'Analyzer to use for the query string.

        This parameter can only be used when the q query string parameter is specified.'
      in: query
      name: analyzer
      schema:
        type: string
      style: form
    query.batched_reduce_size:
      description: 'The number of shard results that should be reduced at once on
        the coordinating node.

        This value should be used as a protection mechanism to reduce the memory overhead
        per search request if the potential number of shards in the request can be
        large.'
      in: query
      name: batched_reduce_size
      schema:
        default: 512
        format: int32
        type: integer
      style: form
    query.cancel_after_time_interval:
      description: 'The time after which the search request will be canceled.

        Request-level parameter takes precedence over `cancel_after_time_interval`
        cluster setting.'
      in: query
      name: cancel_after_time_interval
      schema:
        $ref: '#/components/schemas/Duration'
      style: form
    query.ccs_minimize_roundtrips:
      description: If `true`, network round-trips between the coordinating node and
        the remote clusters are minimized when executing cross-cluster search (CCS)
        requests.
      in: query
      name: ccs_minimize_roundtrips
      schema:
        default: true
        type: boolean
      style: form
    query.default_operator:
      description: 'The default operator for query string query: AND or OR.

        This parameter can only be used when the `q` query string parameter is specified.'
      in: query
      name: default_operator
      schema:
        $ref: '#/components/schemas/Operator'
      style: form
    query.df:
      description: 'Field to use as default where no field prefix is given in the
        query string.

        This parameter can only be used when the q query string parameter is specified.'
      in: query
      name: df
      schema:
        type: string
      style: form
    query.docvalue_fields:
      description: A comma-separated list of fields to return as the docvalue representation
        for each hit.
      in: query
      name: docvalue_fields
      schema:
        $ref: '#/components/schemas/Fields'
      style: form
    query.error_trace:
      description: Whether to include the stack trace of returned errors.
      in: query
      name: error_trace
      schema:
        default: false
        type: boolean
      x-global: true
    query.expand_wildcards:
      description: 'Type of index that wildcard patterns can match.

        If the request can target data streams, this argument determines whether wildcard
        expressions match hidden data streams.

        Supports comma-separated values, such as `open,hidden`.'
      in: query
      name: expand_wildcards
      schema:
        $ref: '#/components/schemas/ExpandWildcards'
      style: form
    query.explain:
      description: If `true`, returns detailed information about score computation
        as part of a hit.
      in: query
      name: explain
      schema:
        type: boolean
      style: form
    query.filter_path:
      description: "Used to reduce the response. This parameter takes a comma-separated\
        \ list of filters. It supports using wildcards to match any field or part\
        \ of a field\u2019s name. You can also exclude fields with \"-\"."
      in: query
      name: filter_path
      schema:
        $ref: '#/components/schemas/StringOrStringArray'
      x-global: true
    query.from:
      description: 'Starting document offset.

        Needs to be non-negative.

        By default, you cannot page through more than 10,000 hits using the `from`
        and `size` parameters.

        To page through more hits, use the `search_after` parameter.'
      in: query
      name: from
      schema:
        default: 0
        format: int32
        type: integer
      style: form
    query.human:
      description: Whether to return human readable values for statistics.
      in: query
      name: human
      schema:
        default: true
        type: boolean
      x-global: true
    query.ignore_throttled:
      description: If `true`, concrete, expanded or aliased indexes will be ignored
        when frozen.
      in: query
      name: ignore_throttled
      schema:
        type: boolean
      style: form
    query.ignore_unavailable:
      description: If `false`, the request returns an error if it targets a missing
        or closed index.
      in: query
      name: ignore_unavailable
      schema:
        type: boolean
      style: form
    query.include_named_queries_score:
      description: Indicates whether `hit.matched_queries` should be rendered as a
        map that includes the name of the matched query associated with its score
        (true) or as an array containing the name of the matched queries (false)
      in: query
      name: include_named_queries_score
      schema:
        default: false
        description: Indicates whether `hit.matched_queries` should be rendered as
          a map that includes the name of the matched query associated with its score
          (true) or as an array containing the name of the matched queries (false)
        type: boolean
    query.lenient:
      description: 'If `true`, format-based query failures (such as providing text
        to a numeric field) in the query string will be ignored.

        This parameter can only be used when the `q` query string parameter is specified.'
      in: query
      name: lenient
      schema:
        type: boolean
      style: form
    query.max_concurrent_shard_requests:
      description: 'Defines the number of concurrent shard requests per node this
        search executes concurrently.

        This value should be used to limit the impact of the search on the cluster
        in order to limit the number of concurrent shard requests.'
      in: query
      name: max_concurrent_shard_requests
      schema:
        default: 5
        format: int32
        type: integer
      style: form
    query.phase_took:
      description: Indicates whether to return phase-level `took` time values in the
        response.
      in: query
      name: phase_took
      schema:
        default: false
        type: boolean
      style: form
    query.pre_filter_shard_size:
      description: 'Defines a threshold that enforces a pre-filter roundtrip to prefilter
        search shards based on query rewriting if the number of shards the search
        request expands to exceeds the threshold.

        This filter roundtrip can limit the number of shards significantly if for
        instance a shard can not match any documents based on its rewrite method (if
        date filters are mandatory to match but the shard bounds and the query are
        disjoint).

        When unspecified, the pre-filter phase is executed if any of these conditions
        is met:

        the request targets more than 128 shards;

        the request targets one or more read-only index;

        the primary sort of the query targets an indexed field.'
      in: query
      name: pre_filter_shard_size
      schema:
        format: int32
        type: integer
      style: form
    query.preference:
      description: 'Nodes and shards used for the search.

        By default, OpenSearch selects from eligible nodes and shards using adaptive
        replica selection, accounting for allocation awareness. Valid values are:

        `_only_local` to run the search only on shards on the local node;

        `_local` to, if possible, run the search on shards on the local node, or if
        not, select shards using the default method;

        `_only_nodes:<node-id>,<node-id>` to run the search on only the specified
        nodes IDs, where, if suitable shards exist on more than one selected node,
        use shards on those nodes using the default method, or if none of the specified
        nodes are available, select shards from any available node using the default
        method;

        `_prefer_nodes:<node-id>,<node-id>` to if possible, run the search on the
        specified nodes IDs, or if not, select shards using the default method;

        `_shards:<shard>,<shard>` to run the search only on the specified shards;

        `<custom-string>` (any string that does not start with `_`) to route searches
        with the same `<custom-string>` to the same shards in the same order.'
      in: query
      name: preference
      schema:
        default: random
        type: string
      style: form
    query.pretty:
      description: Whether to pretty format the returned JSON response.
      in: query
      name: pretty
      schema:
        default: false
        type: boolean
      x-global: true
    query.q:
      description: 'Query in the Lucene query string syntax using query parameter
        search.

        Query parameter searches do not support the full OpenSearch Query DSL but
        are handy for testing.'
      in: query
      name: q
      schema:
        type: string
      style: form
    query.request_cache:
      description: 'If `true`, the caching of search results is enabled for requests
        where `size` is `0`.

        Defaults to index level settings.'
      in: query
      name: request_cache
      schema:
        type: boolean
      style: form
    query.rest_total_hits_as_int:
      description: Indicates whether `hits.total` should be rendered as an integer
        or an object in the rest search response.
      in: query
      name: rest_total_hits_as_int
      schema:
        default: false
        type: boolean
      style: form
    query.routing:
      description: Custom value used to route operations to a specific shard.
      in: query
      name: routing
      schema:
        $ref: '#/components/schemas/RoutingInQueryString'
      style: form
    query.scroll:
      description: 'Period to retain the search context for scrolling. See Scroll
        search results.

        By default, this value cannot exceed `1d` (24 hours).

        You can change this limit using the `search.max_keep_alive` cluster-level
        setting.'
      in: query
      name: scroll
      schema:
        $ref: '#/components/schemas/Duration'
      style: form
    query.search_pipeline:
      description: Customizable sequence of processing stages applied to search queries.
      in: query
      name: search_pipeline
      schema:
        description: Customizable sequence of processing stages applied to search
          queries.
        type: string
    query.search_type:
      description: How distributed term frequencies are calculated for relevance scoring.
      in: query
      name: search_type
      schema:
        $ref: '#/components/schemas/SearchType'
      style: form
    query.seq_no_primary_term:
      description: If `true`, returns sequence number and primary term of the last
        modification of each hit.
      in: query
      name: seq_no_primary_term
      schema:
        type: boolean
      style: form
    query.size:
      description: 'Defines the number of hits to return.

        By default, you cannot page through more than 10,000 hits using the `from`
        and `size` parameters.

        To page through more hits, use the `search_after` parameter.'
      in: query
      name: size
      schema:
        default: 10
        format: int32
        type: integer
      style: form
    query.sort:
      description: A comma-separated list of <field>:<direction> pairs.
      in: query
      name: sort
      schema:
        $ref: '#/components/schemas/StringOrStringArray'
      style: form
    query.source:
      description: The URL-encoded request definition. Useful for libraries that do
        not accept a request body for non-POST requests.
      in: query
      name: source
      schema:
        type: string
      x-global: true
    query.stats:
      description: Specific `tag` of the request for logging and statistical purposes.
      in: query
      name: stats
      schema:
        items:
          type: string
        type: array
      style: form
    query.stored_fields:
      description: 'A comma-separated list of stored fields to return as part of a
        hit.

        If no fields are specified, no stored fields are included in the response.

        If this field is specified, the `_source` parameter defaults to `false`.

        You can pass `_source: true` to return both source fields and stored fields
        in the search response.'
      in: query
      name: stored_fields
      schema:
        $ref: '#/components/schemas/Fields'
      style: form
    query.suggest_field:
      description: Specifies which field to use for suggestions.
      in: query
      name: suggest_field
      schema:
        $ref: '#/components/schemas/Field'
      style: form
    query.suggest_mode:
      description: 'Specifies the suggest mode.

        This parameter can only be used when the `suggest_field` and `suggest_text`
        query string parameters are specified.'
      in: query
      name: suggest_mode
      schema:
        $ref: '#/components/schemas/SuggestMode'
      style: form
    query.suggest_size:
      description: 'Number of suggestions to return.

        This parameter can only be used when the `suggest_field` and `suggest_text`
        query string parameters are specified.'
      in: query
      name: suggest_size
      schema:
        format: int32
        type: integer
      style: form
    query.suggest_text:
      description: 'The source text for which the suggestions should be returned.

        This parameter can only be used when the `suggest_field` and `suggest_text`
        query string parameters are specified.'
      in: query
      name: suggest_text
      schema:
        type: string
      style: form
    query.terminate_after:
      description: 'Maximum number of documents to collect for each shard.

        If a query reaches this limit, OpenSearch terminates the query early.

        OpenSearch collects documents before sorting.

        Use with caution.

        OpenSearch applies this parameter to each shard handling the request.

        When possible, let OpenSearch perform early termination automatically.

        Avoid specifying this parameter for requests that target data streams with
        backing indexes across multiple data tiers.

        If set to `0` (default), the query does not terminate early.'
      in: query
      name: terminate_after
      schema:
        format: int32
        type: integer
      style: form
    query.timeout:
      description: 'Specifies the period of time to wait for a response from each
        shard.

        If no response is received before the timeout expires, the request fails and
        returns an error.'
      in: query
      name: timeout
      schema:
        $ref: '#/components/schemas/Duration'
      style: form
    query.track_scores:
      description: If `true`, calculate and return document scores, even if the scores
        are not used for sorting.
      in: query
      name: track_scores
      schema:
        type: boolean
      style: form
    query.track_total_hits:
      description: 'Number of hits matching the query to count accurately.

        If `true`, the exact number of hits is returned at the cost of some performance.

        If `false`, the response does not include the total number of hits matching
        the query.'
      in: query
      name: track_total_hits
      schema:
        $ref: '#/components/schemas/TrackHits'
      style: form
    query.typed_keys:
      description: If `true`, aggregation and suggester names are be prefixed by their
        respective types in the response.
      in: query
      name: typed_keys
      schema:
        type: boolean
      style: form
    query.version:
      description: If `true`, returns document version as part of a hit.
      in: query
      name: version
      schema:
        type: boolean
      style: form
  requestBodies:
    search:
      content:
        application/json:
          schema:
            description: The search definition using the Query DSL
            properties:
              _source:
                $ref: '#/components/schemas/SourceConfig'
              aggregations:
                additionalProperties:
                  $ref: '#/components/schemas/AggregationContainer'
                description: Defines the aggregations that are run as part of the
                  search request.
                type: object
              aggs:
                additionalProperties:
                  $ref: '#/components/schemas/AggregationContainer'
                description: Defines the aggregations that are run as part of the
                  search request.
                type: object
              collapse:
                $ref: '#/components/schemas/FieldCollapse'
              docvalue_fields:
                description: 'Array of wildcard (`*`) patterns.

                  The request returns doc values for field names matching these patterns
                  in the `hits.fields` property of the response.'
                items:
                  $ref: '#/components/schemas/FieldAndFormat'
                type: array
              explain:
                description: If `true`, returns detailed information about score computation
                  as part of a hit.
                type: boolean
              ext:
                additionalProperties:
                  type: object
                description: Configuration of search extensions defined by OpenSearch
                  plugins.
                type: object
              fields:
                description: 'Array of wildcard (`*`) patterns.

                  The request returns values for field names matching these patterns
                  in the `hits.fields` property of the response.'
                items:
                  $ref: '#/components/schemas/FieldAndFormat'
                type: array
              from:
                description: 'Starting document offset.

                  Needs to be non-negative.

                  By default, you cannot page through more than 10,000 hits using
                  the `from` and `size` parameters.

                  To page through more hits, use the `search_after` parameter.'
                format: int32
                type: integer
              highlight:
                $ref: '#/components/schemas/Highlight'
              indices_boost:
                description: Boosts the `_score` of documents from specified indexes.
                items:
                  additionalProperties:
                    format: float
                    type: number
                  type: object
                type: array
              min_score:
                description: 'Minimum `_score` for matching documents.

                  Documents with a lower `_score` are not included in the search results.'
                format: float
                type: number
              pit:
                $ref: '#/components/schemas/PointInTimeReference'
              post_filter:
                $ref: '#/components/schemas/QueryContainer'
              profile:
                description: 'Set to `true` to return detailed timing information
                  about the execution of individual components in a search request.

                  NOTE: This is a debugging tool and adds significant overhead to
                  search execution.'
                type: boolean
              query:
                $ref: '#/components/schemas/QueryContainer'
              rank:
                $ref: '#/components/schemas/RankContainer'
              rescore:
                description: Can be used to improve precision by reordering just the
                  top (for example 100 - 500) documents returned by the `query` and
                  `post_filter` phases.
                oneOf:
                - $ref: '#/components/schemas/Rescore'
                - items:
                    $ref: '#/components/schemas/Rescore'
                  type: array
              script_fields:
                additionalProperties:
                  $ref: '#/components/schemas/ScriptField'
                description: Retrieve a script evaluation (based on different fields)
                  for each hit.
                type: object
              search_after:
                $ref: '#/components/schemas/SortResults'
              seq_no_primary_term:
                description: If `true`, returns sequence number and primary term of
                  the last modification of each hit.
                type: boolean
              size:
                description: 'The number of hits to return.

                  By default, you cannot page through more than 10,000 hits using
                  the `from` and `size` parameters.

                  To page through more hits, use the `search_after` parameter.'
                format: int32
                type: integer
              slice:
                $ref: '#/components/schemas/SlicedScroll'
              sort:
                $ref: '#/components/schemas/Sort'
              stats:
                description: 'Stats groups to associate with the search.

                  Each group maintains a statistics aggregation for its associated
                  searches.

                  You can retrieve these stats using the indexes stats API.'
                items:
                  type: string
                type: array
              stored_fields:
                $ref: '#/components/schemas/Fields'
              suggest:
                $ref: '#/components/schemas/Suggester'
              terminate_after:
                description: 'Maximum number of documents to collect for each shard.

                  If a query reaches this limit, OpenSearch terminates the query early.

                  OpenSearch collects documents before sorting.

                  Use with caution.

                  OpenSearch applies this parameter to each shard handling the request.

                  When possible, let OpenSearch perform early termination automatically.

                  Avoid specifying this parameter for requests that target data streams
                  with backing indexes across multiple data tiers.

                  If set to `0` (default), the query does not terminate early.'
                format: int32
                type: integer
              timeout:
                description: 'Specifies the period of time to wait for a response
                  from each shard.

                  If no response is received before the timeout expires, the request
                  fails and returns an error.

                  Defaults to no timeout.'
                type: string
              track_scores:
                description: If `true`, calculate and return document scores, even
                  if the scores are not used for sorting.
                type: boolean
              track_total_hits:
                $ref: '#/components/schemas/TrackHits'
              version:
                description: If `true`, returns document version as part of a hit.
                type: boolean
            type: object
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseBody'
      description: ''
    '400':
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: ''
    '404':
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: ''
  schemas:
    AdjacencyMatrixAggregate:
      allOf:
      - $ref: '#/components/schemas/MultiBucketAggregateBaseAdjacencyMatrixBucket'
      - type: object
    AdjacencyMatrixAggregation:
      allOf:
      - $ref: '#/components/schemas/BucketAggregationBase'
      - properties:
          filters:
            additionalProperties:
              $ref: '#/components/schemas/QueryContainer'
            description: 'Filters used to create buckets.

              At least one filter is required.'
            type: object
        type: object
    AdjacencyMatrixBucket:
      allOf:
      - $ref: '#/components/schemas/MultiBucketBase'
      - properties:
          key:
            type: string
        required:
        - key
        type: object
    Aggregate:
      anyOf:
      - $ref: '#/components/schemas/CardinalityAggregate'
      - $ref: '#/components/schemas/HdrPercentilesAggregate'
      - $ref: '#/components/schemas/HdrPercentileRanksAggregate'
      - $ref: '#/components/schemas/TDigestPercentilesAggregate'
      - $ref: '#/components/schemas/TDigestPercentileRanksAggregate'
      - $ref: '#/components/schemas/PercentilesBucketAggregate'
      - $ref: '#/components/schemas/MedianAbsoluteDeviationAggregate'
      - $ref: '#/components/schemas/MinAggregate'
      - $ref: '#/components/schemas/MaxAggregate'
      - $ref: '#/components/schemas/SumAggregate'
      - $ref: '#/components/schemas/AvgAggregate'
      - $ref: '#/components/schemas/WeightedAvgAggregate'
      - $ref: '#/components/schemas/ValueCountAggregate'
      - $ref: '#/components/schemas/SimpleValueAggregate'
      - $ref: '#/components/schemas/DerivativeAggregate'
      - $ref: '#/components/schemas/BucketMetricValueAggregate'
      - $ref: '#/components/schemas/StatsAggregate'
      - $ref: '#/components/schemas/StatsBucketAggregate'
      - $ref: '#/components/schemas/ExtendedStatsAggregate'
      - $ref: '#/components/schemas/ExtendedStatsBucketAggregate'
      - $ref: '#/components/schemas/GeoBoundsAggregate'
      - $ref: '#/components/schemas/GeoCentroidAggregate'
      - $ref: '#/components/schemas/HistogramAggregate'
      - $ref: '#/components/schemas/DateHistogramAggregate'
      - $ref: '#/components/schemas/AutoDateHistogramAggregate'
      - $ref: '#/components/schemas/VariableWidthHistogramAggregate'
      - $ref: '#/components/schemas/StringTermsAggregate'
      - $ref: '#/components/schemas/LongTermsAggregate'
      - $ref: '#/components/schemas/DoubleTermsAggregate'
      - $ref: '#/components/schemas/UnmappedTermsAggregate'
      - $ref: '#/components/schemas/LongRareTermsAggregate'
      - $ref: '#/components/schemas/StringRareTermsAggregate'
      - $ref: '#/components/schemas/UnmappedRareTermsAggregate'
      - $ref: '#/components/schemas/MultiTermsAggregate'
      - $ref: '#/components/schemas/MissingAggregate'
      - $ref: '#/components/schemas/NestedAggregate'
      - $ref: '#/components/schemas/ReverseNestedAggregate'
      - $ref: '#/components/schemas/GlobalAggregate'
      - $ref: '#/components/schemas/FilterAggregate'
      - $ref: '#/components/schemas/ChildrenAggregate'
      - $ref: '#/components/schemas/ParentAggregate'
      - $ref: '#/components/schemas/SamplerAggregate'
      - $ref: '#/components/schemas/UnmappedSamplerAggregate'
      - $ref: '#/components/schemas/GeoHashGridAggregate'
      - $ref: '#/components/schemas/GeoTileGridAggregate'
      - $ref: '#/components/schemas/RangeAggregate'
      - $ref: '#/components/schemas/DateRangeAggregate'
      - $ref: '#/components/schemas/GeoDistanceAggregate'
      - $ref: '#/components/schemas/IpRangeAggregate'
      - $ref: '#/components/schemas/FiltersAggregate'
      - $ref: '#/components/schemas/AdjacencyMatrixAggregate'
      - $ref: '#/components/schemas/SignificantLongTermsAggregate'
      - $ref: '#/components/schemas/SignificantStringTermsAggregate'
      - $ref: '#/components/schemas/UnmappedSignificantTermsAggregate'
      - $ref: '#/components/schemas/CompositeAggregate'
